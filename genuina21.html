<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Genuína Marcha - Em Construção</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .logo {
      font-size: 3rem;
      font-weight: bold;
      color: #e60000;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: bold;
      color: #e60000;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .progress {
      height: 100%;
      background-color: #e60000;
      width: 0%;
      animation: progress 5s linear infinite;
    }

    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Genuína Marcha</div>
    <img src="./img/logo.png" alt="Genuína Marcha"  width="200" height="200">
    <h1>Site em Construção</h1>
    <p>Estamos preparando algo especial para você. <br>
        <div className="mt-6 text-sm text-white/50">
            🐎 Genuína Marcha - Em breve! </p>
    <div class="progress-bar">
      <div class="progress"></div>
      <div className="mt-6 text-sm text-white/50">
        🐎 Genuína Marcha - Em breve!
      </div>
    </div>
    <p>Carregando...</p>
  </div>
  
</body>
</html>
